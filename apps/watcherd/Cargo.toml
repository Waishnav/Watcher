[package]
name = "watcherd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
watcher-core = { path = "../../crates/watcher-core" }
watcher-ipc = { path = "../../crates/watcher-ipc" }
watcher-storage = { path = "../../crates/watcher-storage" }
watcher-platform = { path = "../../crates/watcher-platform" }
serde_json = "1"
fs2 = "0.4"
chrono = "0.4"
ctrlc = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_System_Pipes", "Win32_System_IO",
  "Win32_Storage_FileSystem", "Win32_Security",
] }
