name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-quality:
    name: Rust formatting, lint and scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check shell and desktop bridge syntax
        run: |
          bash -n scripts/install-user.sh scripts/uninstall-user.sh scripts/qa/x11-isolated.sh
          node --check integrations/gnome/watcher-focus@watcher/extension.js
          node --check integrations/kwin/watcher-focus/contents/code/main.js

  rust-msrv:
    name: Minimum Rust version (1.85)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.85.0'
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --workspace --locked --all-targets

  rust-platforms:
    name: Rust native build + tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Identify native compiler target
        run: rustc --version --verbose
      - run: cargo build --workspace --locked --all-targets
      - run: cargo test --workspace --locked
      - name: CLI startup sanity check
        run: cargo run --locked -p watcher -- --help
      - name: Check Windows installation script syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @('scripts/install-user.ps1', 'scripts/uninstall-user.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }

  tui:
    name: OpenTUI typecheck + bundle / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    defaults:
      run:
        working-directory: apps/tui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build

  browser-extension:
    name: WXT Chrome + Firefox / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    defaults:
      run:
        working-directory: apps/extension
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bunx wxt prepare
      - run: bun run check
      - run: bun run test
      - run: bun run build
      - run: bun run build:firefox

  browser-runtime:
    name: Isolated Chrome extension runtime and offline replay
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Build native daemon and browser bridge
        run: cargo build --workspace --locked
      - name: Install browser QA dependencies
        working-directory: apps/extension
        run: bun install --frozen-lockfile
      - name: Install Playwright Chromium for unpacked-extension QA
        working-directory: apps/extension
        run: bunx playwright-core install chromium --no-shell
      - name: Verify isolated extension behavior and Native Messaging replay
        working-directory: apps/extension
        run: bun run qa:chrome
