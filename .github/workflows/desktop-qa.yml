name: Isolated X11 QA
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0'
permissions:
  contents: read
jobs:
  x11-focus:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y xvfb openbox xterm xdotool sqlite3
      - run: cargo build --workspace --locked
      - run: WATCHER_XVFB_QA=1 xvfb-run -a -s '-screen 0 1280x720x24' bash scripts/qa/x11-isolated.sh
